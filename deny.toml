# cargo-deny configuration: `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # SQLite before 3.54 returns uninitialized page-cache memory for a database and `-wal` pair
    # crafted with different page sizes. sqlx 0.9.0 (the latest release) caps libsqlite3-sys
    # below 0.38, so the patched 0.39 cannot be resolved; sqlx's main branch already allows it.
    # Exposure needs the process to open database files a less trusted party wrote, which no
    # lesto test or example does. Remove once a sqlx release allows libsqlite3-sys 0.39.
    { id = "RUSTSEC-2026-0459", reason = "fix blocked on a sqlx release; see the comment above" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-root-certs (feature `oidc`, through reqwest's platform verifier): Mozilla's CA list,
    # a data license with no copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
