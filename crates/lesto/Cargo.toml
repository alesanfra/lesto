[package]
name = "lesto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "FastAPI-like web framework on top of axum: garde validation, OpenAPI from types, optional sqlx stores and AWS Lambda"

[dependencies]
lesto-macros.workspace = true
axum.workspace = true
garde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_html_form.workspace = true
serde_path_to_error.workspace = true
mime.workspace = true
form_urlencoded.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time"] }
http.workspace = true
indexmap.workspace = true
tower-layer = "0.3"
tower-service = "0.3"
pin-project-lite.workspace = true
anyhow = { workspace = true, optional = true }
tracing.workspace = true
# feature `db`
sqlx = { workspace = true, optional = true }
# feature `db`: the value type of a transaction setting. Not a feature of its own — an RLS
# identity is made of UUIDs in practice, and `default-features = false` brings nothing with it.
uuid = { workspace = true, optional = true }
# feature `otel`
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# feature `lambda`
lambda_http = { version = "1.3", default-features = false, features = ["apigw_rest", "apigw_http", "alb"], optional = true }
tower = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

[features]
default = ["email", "url"]
# `#[garde(email)]` and `#[garde(url)]`; off drops garde's regex and idna dependencies.
email = ["garde/email", "lesto-macros/email"]
url = ["garde/url", "lesto-macros/url"]
# `#[garde(pattern(..))]`; `email` includes it.
pattern = ["garde/regex", "lesto-macros/regex"]
# `From<anyhow::Error> for HttpError` (and `lesto::db::Error`): a 500 with the detail hidden
# and the cause logged.
anyhow = ["dep:anyhow"]
# `lesto::db`: sqlx stores with principals and permissions. Pick the database too.
db = ["dep:sqlx", "dep:uuid"]
postgres = ["db", "sqlx/postgres"]
mysql = ["db", "sqlx/mysql"]
sqlite = ["db", "sqlx/sqlite"]
# `lesto::lambda`: run the app on AWS Lambda behind API Gateway, a Function URL or an ALB.
lambda = ["dep:lambda_http", "dep:tower", "dep:http-body-util"]
# `lesto::otel`: OTLP export of spans *and* log events, configured by the standard `OTEL_*`
# variables (`App::serve` sets it up by itself), plus trace context propagation so an incoming
# `traceparent` continues here. The spans themselves need no feature.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# Tests exercise every feature.
lesto = { path = ".", features = ["anyhow", "email", "url", "sqlite", "postgres", "lambda", "otel"] }
# `postgres` and `uuid` for `tests/db_postgres.rs`, which binds a `Uuid`; lesto itself never
# binds one, so the `db` feature does not ask sqlx for it.
sqlx = { workspace = true, features = ["sqlite", "postgres", "uuid", "derive"] }
anyhow.workspace = true
tower.workspace = true
http-body-util.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "overhead"
harness = false
