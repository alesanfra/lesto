[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/alesanfra/lesto"
keywords = ["web", "framework", "openapi", "axum", "fastapi"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
axum = "0.8"
# `email` and `url` are features of `lesto` (default on), so an application can drop regex/idna.
garde = { version = "0.23", features = ["derive"] }
# `preserve_order` on both is a guarantee, not a convenience: JSON keys keep declaration order in
# the OpenAPI document and in response bodies. It is a unified feature (every `serde_json::Map`
# in the graph becomes an `IndexMap`); see AGENTS.md, "Design decisions".
schemars = { version = "1.2", features = ["derive", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_html_form = "0.2"
serde_path_to_error = "0.1"
mime = "0.3"
form_urlencoded = "1"
base64 = "0.22"
# No features here: `lesto` lists the ones it uses, examples inherit them through unification.
tokio = "1"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
# Safe pin projection for the hand-written layer futures in `lesto::layers`. Macro-only crate,
# already in the tree through tokio and hyper.
pin-project-lite = "0.2"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
tracing = "0.1"
# feature `otel` of `lesto`: the API crate, the SDK, OTLP exporters over HTTP/protobuf (no TLS
# stack, no gRPC), the bridges that turn a `tracing` span into an OpenTelemetry span and a
# `tracing` event into an OpenTelemetry log record, and the subscriber `lesto::otel::init`
# installs.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", default-features = false }

# Intra-workspace dependency: `version` is required to publish, `path` to build from a checkout.
lesto-macros = { path = "crates/lesto-macros", version = "0.1.0" }

# Dependencies are compiled once, optimized; `lesto dev` rebuilds only touch workspace crates.
[profile.dev.package."*"]
opt-level = 3

# CI builds everything once and runs it once: optimizing dependencies (above, for `lesto dev`)
# and emitting debug info only cost build minutes there. `cargo test --profile ci`.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
