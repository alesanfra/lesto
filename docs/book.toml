[book]
title = "lesto"
description = "A Rust web framework with FastAPI's ergonomics: garde validation, OpenAPI from types."
authors = ["lesto contributors"]
language = "en"
src = "tutorial"

[build]
build-dir = "book"

[output.html]
site-url = "/lesto/"
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/alesanfra/lesto"
edit-url-template = "https://github.com/alesanfra/lesto/edit/main/docs/tutorial/{path}"
no-section-label = true

[output.html.playground]
runnable = false

[output.html.search]
limit-results = 20
