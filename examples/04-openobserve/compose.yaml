# A local OpenObserve: OTLP ingestion and the UI on the same port.
#
#   docker compose up -d      # then http://localhost:5080
#
# The credentials are the ones the application sends in OTEL_EXPORTER_OTLP_HEADERS (see
# README.md). They are a demo pair on a port bound to localhost — do not reuse them anywhere.
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: lesto-openobserve
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data

volumes:
  openobserve-data:
