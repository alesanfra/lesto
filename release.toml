# `cargo release patch` (or minor, X.Y.Z) shows the plan, `--execute` runs it: one shared version,
# one commit, one tag `vX.Y.Z`, pushed. The tag runs .github/workflows/release.yml, which publishes.
# cargo-release does not: its "Publishing ..." line only lists the crates (`publish = false`).
allow-branch = ["main"]
consolidate-commits = true
pre-release-commit-message = "chore: release v{{version}}"
publish = false
push = true
tag-name = "v{{version}}"
tag-message = "lesto {{version}}"
