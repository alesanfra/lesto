name: Release

# Pushing a tag `vX.Y.Z` (`cargo release`, see release.toml) publishes lesto-macros, lesto and
# lesto-cli to crates.io, then creates the GitHub release with the version's CHANGELOG section as
# its notes. No API token is stored: crates.io trusts this file of this repository (Trusted
# Publishing, configured on each crate's settings page with workflow `release.yml` and environment
# `release`) and hands out a short-lived token in exchange for the job's OIDC token. A crate's
# first version cannot be published this way; 0.1.0 was published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    # Restrict the environment to `v*` tags in the repository settings: crates.io checks it too.
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # the crates.io token
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Both checks run before anything is published: a tag that does not match
      # `[workspace.package] version` would publish the wrong version (or fail halfway on one that
      # already exists), and a version without a CHANGELOG section would have no release notes.
      - name: Check the tag against the workspace version and the changelog
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lesto") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          # The version's section, from its heading to the next one.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes in dependency order (lesto-macros before lesto) and verifies each package.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "lesto ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
