name: Release

# A tag `vX.Y.Z` (pushed by `cargo release`, see release.toml) publishes the three crates and
# creates the GitHub release, with the version's CHANGELOG section as notes. No token is stored:
# crates.io Trusted Publishing (each crate's settings: workflow `release.yml`, environment
# `crates-io`) trades the job's OIDC token for a short-lived one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    # Restrict the environment to `v*` tags in the repository settings: crates.io checks it too.
    environment: crates-io
    permissions:
      contents: write # the GitHub release
      id-token: write # the crates.io token
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Before anything is published: a tag that differs from the workspace version, or a version
      # with no CHANGELOG section, stops the release here.
      - name: Check the tag against the workspace version and the changelog
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lesto") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          # The version's section, from its heading to the next one.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes in dependency order (lesto-macros before lesto) and verifies each package.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # A release created by hand for the tag (the "Draft a new release" button, which can also
      # create the tag) is updated rather than failed on: v0.4.0 was published to crates.io and
      # then failed here with "Release.tag_name already exists".
      - name: Create or update the GitHub release
        run: |
          title="lesto ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
