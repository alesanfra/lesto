name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Three jobs, not one per check: every job compiles the dependency tree from scratch (or from its
# own cache), so checks that can share a build share a job. Everything builds with `--profile ci`
# (Cargo.toml): unoptimized dependencies and no debug info, several times faster than `dev`.
jobs:
  lint:
    name: fmt, clippy, docs, features, deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-deny,mdbook
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --profile ci --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --profile ci --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # --no-dev-deps: lesto's dev-dependency on itself would turn every feature back on.
      - run: cargo hack check -p lesto --each-feature --no-dev-deps --profile ci
      - run: sh docs/build.sh
      - run: cargo deny check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # tests/db_postgres.rs runs against it; without LESTO_TEST_POSTGRES_URL it would be skipped.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: lesto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A real OpenID Connect provider for `tests/oidc_provider.rs`. JSON_CONFIG is the one of
      # examples/06-oidc/compose.yaml: keep the two in sync. No health check (the image has no
      # shell); the test waits for the discovery document itself.
      oauth2:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.2
        ports:
          - 8089:8080
        env:
          JSON_CONFIG: >-
            {
              "interactiveLogin": false,
              "tokenCallbacks": [
                {
                  "issuerId": "default",
                  "tokenExpiry": 300,
                  "requestMappings": [
                    {
                      "requestParam": "scope",
                      "match": "admin",
                      "claims": {"sub": "ada", "aud": ["api://notes"], "azp": "notes-cli", "scope": "notes:read admin"}
                    },
                    {
                      "requestParam": "scope",
                      "match": "*",
                      "claims": {"sub": "bob", "aud": ["api://notes"], "azp": "notes-cli", "scope": "notes:read"}
                    }
                  ]
                }
              ]
            }
    env:
      LESTO_TEST_POSTGRES_URL: postgres://postgres:lesto@127.0.0.1:5432/postgres
      LESTO_TEST_OIDC_URL: http://localhost:8089/default
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --profile ci --locked
      # The MCP endpoint against a second client, the MCP Inspector (TypeScript SDK), next to
      # rmcp in the tests: strict tool schemas, calls, tool errors and the 401, in both eras.
      # Here rather than in a job of its own, to reuse the build of examples/02-notes above.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sh scripts/mcp-inspector.sh
        env:
          CARGO_PROFILE: ci

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features --profile ci --locked
